<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B5D3B">
<title>Mahiber: Share, Equb and Iddir</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-apple-180.png">
<style>
:root{--g:#0B5D3B;--gd:#084A2F;--gl:#E3F1E8;--bg:#F4F6F3;--ink:#14201A;--mut:#55615A;--line:#DDE3DD;--amb:#F5B93A;--ambl:#FFF1CC;--ambd:#5E4200;--red:#8A1F11;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Ethiopic","Noto Sans",sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:14px 16px 6px}
header h1{margin:0;font-size:21px;font-weight:800;flex:1;min-width:0;overflow-wrap:anywhere}
.brand{color:var(--g)} .logo{width:46px;height:46px;flex:none;display:block} .sub{font-size:13px;color:var(--mut);font-weight:400}
main{flex:1;padding:8px 16px 96px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.hero{background:var(--g);color:#fff;border:0}
.hero .big{font-size:30px;font-weight:800;line-height:1.1}
.hero .soft{color:#EAF5EE;font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.mut{color:var(--mut);font-size:14px}
.b{font-weight:700}
h2{margin:6px 0 0;font-size:16px}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
button,.btn{font:inherit;font-weight:700;min-height:46px;padding:0 16px;border-radius:12px;border:1.5px solid var(--g);background:transparent;color:var(--g);cursor:pointer}
button.pri,a.btn.pri{background:var(--g);color:#fff}
button.amb{background:var(--amb);border-color:var(--amb);color:var(--ink)}
button.danger{border-color:var(--red);color:var(--red)}
button.sm{min-height:44px;padding:0 12px;font-size:14px}
button.icon{width:46px;padding:0;border-color:var(--line);color:var(--ink);background:#fff;display:flex;align-items:center;justify-content:center}
button.link{border:0;padding:0 4px;min-height:44px}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.full{width:100%}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--gl);color:var(--g)} .p-no{background:#ECEFEC;color:#3C4740} .p-amb{background:var(--ambl);color:var(--ambd)}
.list{padding:0;gap:0;overflow:hidden}
.list>div{padding:10px 16px;border-bottom:1px solid #E8ECE8}
.list>div:last-child{border-bottom:0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles button{min-height:64px;padding:6px;font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:#E4E9E4;border-radius:12px;padding:4px}
.tabs button{border:0;min-height:44px;color:var(--ink)}
.tabs button[aria-pressed=true]{background:#fff;color:var(--g)}
.bar{height:8px;border-radius:4px;background:#2E7A58;overflow:hidden}
.bar>i{display:block;height:8px;background:var(--amb)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line)}
nav>div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:4px 8px 8px}
nav button{border:0;min-height:52px;color:var(--mut);font-size:13px}
nav button[aria-current=page]{color:var(--g)}
label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
input,select,textarea{font:inherit;min-height:46px;padding:8px 12px;border-radius:10px;border:1px solid #8E9A92;background:#fff;color:var(--ink);width:100%}
textarea{min-height:110px;resize:vertical}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.checks label{flex-direction:row;align-items:center;gap:8px;font-weight:400;min-height:44px;font-size:15px}
.checks input{width:20px;min-height:20px;height:20px;accent-color:var(--g)}
#sheet{position:fixed;inset:0;background:rgba(20,32,26,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#sheet[hidden]{display:none}
#sheet.still form,#sheet.still .box{animation:none!important}
.share3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px} .share3 a.btn{min-height:46px;padding:0 6px;border-radius:12px;border:1.5px solid var(--g);color:var(--g);font-weight:700;font-size:15px}
#sheet form,#sheet .box{background:#fff;width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:12px}
.err{color:var(--red);font-weight:600;font-size:14px}
.note{background:var(--gl);color:#0A4B30;border-radius:10px;padding:10px 12px;font-size:14px}
.warn{background:var(--ambl);color:var(--ambd);border-radius:10px;padding:10px 12px;font-size:14px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;overflow-wrap:anywhere}
.crow{display:flex;flex-direction:row;align-items:center;gap:8px;min-height:44px;font-weight:400;font-size:15px;width:100%;text-align:left;color:var(--ink)}
.crow input{width:20px;min-height:20px;height:20px;accent-color:var(--g);flex:none}
label.filebtn{flex-direction:row;align-items:center;justify-content:center;text-align:center;cursor:pointer;position:relative;border:1.5px solid var(--g);border-radius:12px;color:var(--g);font-weight:700;min-height:44px;padding:0 12px}
label.filebtn input{position:absolute;inset:0;opacity:0;min-height:0;cursor:pointer}
label.filebtn:focus-within{outline:3px solid var(--amb);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:6}
#toast[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){#sheet form,#sheet .box{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>

<script id="core">
/* Pure logic: no DOM. Tested separately. */
const Core = (() => {
  const enc = new TextEncoder();
  const hex = b => Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
  const sha = async s => hex(await crypto.subtle.digest('SHA-256', enc.encode(s)));
  const rnd = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return a; };
  const uid = () => hex(rnd(8));
  const toC = v => { const n = Number(String(v == null ? '' : v).replace(/,/g, '').trim()); return Number.isFinite(n) && n > 0 ? Math.round(n * 100) : 0; };

  function splitEqual(amountC, ids) {
    const n = ids.length, base = Math.floor(amountC / n), r = amountC - base * n, o = {};
    ids.forEach((id, i) => { o[id] = base + (i < r ? 1 : 0); });
    return o;
  }
  function shareBalances(g) {
    const b = {};
    g.members.forEach(m => { b[m.id] = 0; });
    for (const e of g.expenses) {
      if (e.void) continue;
      b[e.paidBy] += e.amountC;
      const s = splitEqual(e.amountC, e.among);
      for (const id in s) b[id] -= s[id];
    }
    for (const s of g.settlements) { b[s.from] += s.amountC; b[s.to] -= s.amountC; }
    return b;
  }
  function settleUp(b) {
    const d = [], c = [];
    for (const id in b) { if (b[id] < 0) d.push([id, -b[id]]); else if (b[id] > 0) c.push([id, b[id]]); }
    d.sort((x, y) => y[1] - x[1]); c.sort((x, y) => y[1] - x[1]);
    const out = []; let i = 0, j = 0;
    while (i < d.length && j < c.length) {
      const a = Math.min(d[i][1], c[j][1]);
      out.push({ from: d[i][0], to: c[j][0], amountC: a });
      d[i][1] -= a; c[j][1] -= a;
      if (!d[i][1]) i++;
      if (!c[j][1]) j++;
    }
    return out;
  }

  const newSeed = () => hex(rnd(32));
  /* mix is the members' number, chosen after the sealed code was sent. Old draws have none. */
  async function pickIndex(seed, round, n, mix) {
    const h = await sha(seed + '|' + round + (mix == null ? '' : '|' + mix));
    return Number(BigInt('0x' + h) % BigInt(n));
  }

  /* The ledger is the only record. Each entry is an event {type, gid, data}; groups are rebuilt
     by replaying it, so changing any figure breaks the hash chain. Entries from before this
     format have `text` instead of `data` and keep their original hash. */
  const entryHash = (prev, e) => sha(prev + '|' + JSON.stringify([e.i, e.at, e.type, e.gid, e.data === undefined ? e.text : e.data]));
  async function appendLedger(st, type, gid, data) {
    const prev = st.ledger.length ? st.ledger[st.ledger.length - 1].hash : 'genesis';
    const e = { i: st.ledger.length + 1, at: new Date().toISOString(), type, gid, data, prev };
    e.hash = await entryHash(prev, e);
    st.ledger.push(e);
    return e;
  }
  async function verifyLedger(st) {
    let prev = 'genesis';
    for (const e of st.ledger) {
      if (e.prev !== prev || (await entryHash(prev, e)) !== e.hash) return e.i;
      prev = e.hash;
    }
    return 0;
  }

  /* Gregorian date to Ethiopian calendar date. */
  function ethDate(d) {
    const y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    const a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
    const jdn = day + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
    const k = jdn - 1723856, r = k % 1461, n = r % 365 + 365 * Math.floor(r / 1460);
    return { year: 4 * Math.floor(k / 1461) + Math.floor(r / 365) - Math.floor(r / 1460), month: Math.floor(n / 30) + 1, day: n % 30 + 1 };
  }

  const b64 = u => { let s = ''; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function deriveKey(pin, salt) {
    const km = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function seal(key, salt, obj) {
    const iv = rnd(12);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)));
    return { enc: true, salt: b64(salt), iv: b64(iv), ct: b64(new Uint8Array(ct)) };
  }
  async function unseal(pin, box) {
    const salt = ub64(box.salt), key = await deriveKey(pin, salt);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub64(box.iv) }, key, ub64(box.ct));
    return { key, salt, data: JSON.parse(new TextDecoder().decode(pt)) };
  }
  function qp(v) {
    const bytes = []; v = v.replace(/=\r?\n/g, '');
    for (let i = 0; i < v.length; i++) {
      if (v[i] === '=' && /^[0-9A-Fa-f]{2}$/.test(v.substr(i + 1, 2))) { bytes.push(parseInt(v.substr(i + 1, 2), 16)); i += 2; }
      else bytes.push(...enc.encode(v[i]));
    }
    return new TextDecoder().decode(new Uint8Array(bytes));
  }
  /* Contacts from a .vcf export: [{name, phone}], one entry per card with a number. */
  function parseVcf(text) {
    const out = [], seen = new Set();
    const lines = String(text || '').replace(/=\r?\n(?=[^\r\n]*)/g, m => m).replace(/\r?\n[ \t]/g, '').split(/\r?\n/);
    let cur = null, pend = '';
    for (let raw of lines) {
      if (pend) { raw = pend + raw; pend = ''; }
      if (/ENCODING=QUOTED-PRINTABLE/i.test(raw) && /=$/.test(raw)) { pend = raw.slice(0, -1); continue; }
      const up = raw.toUpperCase();
      if (up.startsWith('BEGIN:VCARD')) { cur = { fn: '', n: '', tel: '' }; continue; }
      if (!cur) continue;
      if (up.startsWith('END:VCARD')) {
        const name = (cur.fn || cur.n).trim().slice(0, 60), phone = cur.tel, k = phone || name.toLowerCase();
        if (phone && !seen.has(k)) { seen.add(k); out.push({ name: name || phone, phone }); }
        cur = null; continue;
      }
      const c = raw.indexOf(':'); if (c < 0) continue;
      const head = raw.slice(0, c).toUpperCase(), key = head.split(';')[0].split('.').pop();
      let val = raw.slice(c + 1); if (/QUOTED-PRINTABLE/.test(head)) val = qp(val);
      if (key === 'FN') cur.fn = val.replace(/\\([,;])/g, '$1');
      else if (key === 'N' && !cur.n) { const a = val.split(';'); cur.n = [a[1], a[0]].filter(Boolean).join(' ').replace(/\\([,;])/g, '$1'); }
      else if (key === 'TEL' && !cur.tel) cur.tel = val.replace(/^tel:/i, '').replace(/[^\d+]/g, '').slice(0, 16);
    }
    return out;
  }
  /* v1: groups stored beside a text ledger. v2: the ledger of events is the record. */
  function validState(s) {
    if (!s || !Array.isArray(s.ledger)) return false;
    if (s.v === 2) return true;
    return s.v === 1 && Array.isArray(s.groups) &&
      s.groups.every(g => g && typeof g.id === 'string' && ['share', 'equb', 'iddir'].includes(g.type) && Array.isArray(g.members));
  }

  /* Strict check for a backup from outside the app: every field has the type and format the app writes. */
  const METHODS = ['Telebirr', 'CBE Birr', 'bank', 'cash'];
  const isObj = x => !!x && typeof x === 'object' && !Array.isArray(x);
  const isId = x => typeof x === 'string' && /^[0-9a-f]{16}$/.test(x);
  const h64 = x => typeof x === 'string' && /^[0-9a-f]{64}$/.test(x);
  const str = (x, n) => typeof x === 'string' && x.length <= n;
  const optStr = (x, n) => x == null || str(x, n);
  const amt = x => Number.isSafeInteger(x) && x >= 0;
  const time = x => typeof x === 'string' && x.length <= 40 && !isNaN(Date.parse(x));
  const optTime = x => x == null || time(x);
  const optBool = x => x == null || typeof x === 'boolean';
  /* pub: a group rebuilt from a shared summary, where draw seeds are opened only after the draw. */
  function validGroup(g, pub) {
    if (!isObj(g) || !isId(g.id) || !str(g.name, 60) || !optTime(g.created) || !Array.isArray(g.members) || g.members.length > 500) return false;
    if (!g.members.every(m => isObj(m) && isId(m.id) && str(m.name, 60) && optStr(m.phone, 20) && optBool(m.me))) return false;
    const ids = new Set(g.members.map(m => m.id)), mem = x => ids.has(x);
    if (ids.size !== g.members.length) return false;
    if (g.type === 'share') {
      return Array.isArray(g.expenses) && g.expenses.every(e => isObj(e) && isId(e.id) && str(e.what, 80) && amt(e.amountC) && mem(e.paidBy) &&
          Array.isArray(e.among) && e.among.length > 0 && e.among.every(mem) && optTime(e.at) && optBool(e.void)) &&
        Array.isArray(g.settlements) && g.settlements.every(s => isObj(s) && mem(s.from) && mem(s.to) && amt(s.amountC) &&
          (s.method == null || METHODS.includes(s.method)) && optStr(s.ref, 40) && optTime(s.at)) &&
        (g.requests == null || (isObj(g.requests) && Object.keys(g.requests).every(k => mem(k) && time(g.requests[k]))));
    }
    if (!amt(g.amountC) || !isObj(g.pay)) return false;
    const payOk = re => Object.keys(g.pay).every(k => re.test(k) && isObj(g.pay[k]) && Object.keys(g.pay[k]).every(id => {
      const p = g.pay[k][id]; return mem(id) && isObj(p) && METHODS.includes(p.method) && optStr(p.ref, 40) && optTime(p.at);
    }));
    if (g.type === 'equb') {
      return payOk(/^r\d{1,3}$/) && ['daily', 'weekly', 'monthly'].includes(g.freq) && Number.isSafeInteger(g.round) &&
        g.round >= 1 && g.round <= g.members.length && typeof g.done === 'boolean' && isObj(g.draws) &&
        Object.keys(g.draws).every(r => {
          const d = g.draws[r]; return /^\d{1,3}$/.test(r) && isObj(d) && (h64(d.seed) || (pub && d.seed == null)) && h64(d.commit) && optStr(d.mix, 40) &&
            (d.winnerId == null || (mem(d.winnerId) && Array.isArray(d.eligible) && d.eligible.every(mem) && optTime(d.at)));
        });
    }
    if (g.type === 'iddir') {
      return payOk(/^E\d{4}-\d{2}$/) && Array.isArray(g.payouts) &&
        g.payouts.every(o => isObj(o) && isId(o.id) && mem(o.memberId) && str(o.reason, 80) && amt(o.amountC) && time(o.at));
    }
    return false;
  }
  const PKEY = /^(r\d{1,3}|E\d{4}-\d{2})$/;
  const copy = x => JSON.parse(JSON.stringify(x));
  /* Apply one event to the groups. Events that do not fit the current state are ignored. */
  function apply(gs, all, e) {
    const d = e.data, at = e.at, gid = e.gid;
    if (!isObj(d) || !isId(gid)) return;
    if (e.type === 'create' || e.type === 'snapshot') {
      if (all.has(gid)) return;
      let g;
      if (e.type === 'snapshot') {
        g = copy(d.group);
        if (!isObj(g) || g.id !== gid || !Array.isArray(g.members) || !g.members.every(m => isObj(m) && isId(m.id))) return;
      } else {
        if (!['share', 'equb', 'iddir'].includes(d.type) || !Array.isArray(d.members) || !d.members.every(m => isObj(m) && isId(m.id))) return;
        g = { id: gid, type: d.type, name: d.name, created: at, members: copy(d.members) };
        if (d.type === 'share') { g.expenses = []; g.settlements = []; g.requests = {}; }
        else { g.amountC = d.amountC; g.pay = {}; if (d.type === 'equb') { g.freq = d.freq; g.round = 1; g.draws = {}; g.done = false; } else g.payouts = []; }
      }
      gs.set(gid, g); all.set(gid, g); return;
    }
    const g = gs.get(gid); if (!g) return;
    const has = id => isId(id) && g.members.some(m => m.id === id);
    switch (e.type) {
      case 'expense':
        if (g.expenses && isId(d.id) && has(d.paidBy) && Array.isArray(d.among) && d.among.length && d.among.every(has))
          g.expenses.push({ id: d.id, what: d.what, amountC: d.amountC, paidBy: d.paidBy, among: d.among.slice(), at });
        break;
      case 'void': { const x = g.expenses && g.expenses.find(y => y.id === d.id); if (x) x.void = true; break; }
      case 'settle':
        if (g.settlements && has(d.from) && has(d.to)) {
          g.settlements.push({ from: d.from, to: d.to, amountC: d.amountC, method: d.method, ref: d.ref, at });
          if (g.requests) delete g.requests[d.from];
        }
        break;
      case 'request': if (g.requests && has(d.from)) g.requests[d.from] = at; break;
      case 'member':
        if (isId(d.id) && !has(d.id)) {
          g.members.push({ id: d.id, name: d.name, phone: d.phone });
          /* join: earlier expenses this person also shares, so those are split again with them */
          if (g.expenses && Array.isArray(d.join)) for (const x of g.expenses) if (!x.void && d.join.includes(x.id) && !x.among.includes(d.id)) x.among.push(d.id);
        }
        break;
      case 'pay':
        if (g.pay && PKEY.test(d.key) && has(d.mid)) { const p = g.pay[d.key] = g.pay[d.key] || {}; if (!p[d.mid]) p[d.mid] = { method: d.method, ref: d.ref, at }; }
        break;
      case 'undo': if (g.pay && PKEY.test(d.key) && g.pay[d.key] && has(d.mid)) delete g.pay[d.key][d.mid]; break;
      case 'commit': if (g.draws && !g.done && d.round === g.round && !g.draws[d.round]) g.draws[d.round] = { seed: d.seed, commit: d.commit }; break;
      case 'draw': {
        const x = g.draws && d.round === g.round && g.draws[d.round];
        if (x && !x.winnerId && has(d.winnerId) && Array.isArray(d.eligible) && d.eligible.every(has))
          Object.assign(x, { mix: d.mix, winnerId: d.winnerId, eligible: d.eligible.slice(), at });
        break;
      }
      case 'next':
        if (g.type === 'equb' && !g.done && d.round === g.round && g.draws[g.round] && g.draws[g.round].winnerId) { if (g.round >= g.members.length) g.done = true; else g.round++; }
        break;
      case 'payout': if (g.payouts && isId(d.id) && has(d.memberId)) g.payouts.push({ id: d.id, memberId: d.memberId, reason: d.reason, amountC: d.amountC, at }); break;
      case 'delete': gs.delete(gid); break;
    }
  }
  /* Rebuild every group from the ledger. groups: newest first; all: also deleted ones (for history). */
  function replay(ledger) {
    const gs = new Map(), all = new Map();

/* Open the phone's share sheet with the message and, where the phone allows it, the QR pictures.

async function shareMsg(text) {

function summaryLines(g, nm) {

  return `<div class="card list">${g.members.map(m => { const x = p[m.id]; return `<div class="row"><div class="grow"><div class="b">${esc(m.name)}</div>
    <div class="mut">${x ? esc(mlabel(x.method)) + (x.ref ? ' · ' + esc(x.ref) : '') : t('notPaid')}</div></div>
    ${x ? `<span class="pill p-ok">${t('paid')}</span><button class="sm link" data-act="ask-undo" data-mid="${esc(m.id)}" data-key="${esc(key)}">${t('undo')}</button>`
        : `<button class="sm pri" data-act="sheet" data-kind="pay" data-mid="${esc(m.id)}" data-key="${esc(key)}">${t('record')}</button>`}</div>`; }).join('')}</div>`;
}
function vEqub(g) {
  const n = g.members.length, key = 'r' + g.round, paidN = Object.keys(pays(g, key)).length, d = g.draws[g.round] || {};
  const order = Object.keys(g.draws).map(Number).sort((a, b) => a - b).filter(r => g.draws[r].winnerId)
    .map(r => `<div class="row"><span class="pill ${r === g.round && !g.done ? 'p-amb' : 'p-ok'}">${r}</span><span class="grow b">${esc(mname(g, g.draws[r].winnerId))}</span>
      <button class="sm link" data-act="check-draw" data-round="${r}">${t('checkDraw')}</button></div>`).join('');
  let draw = '';
  if (!g.done) {
    if (d.winnerId) draw = '';
    else if (d.commit) draw = `<div class="card"><div class="b">${t('sealed')}</div><div class="mono">${esc(d.commit)}</div><div class="mut">${t('sealedHelp')}</div>
      <div class="row"><button class="grow" data-act="copy" data-text="${esc(t('sealed') + ': ' + d.commit)}">${t('copyCode')}</button><button class="amb grow" data-act="sheet" data-kind="draw">${t('runDraw')}</button></div></div>`;
    else draw = `<button class="amb full" data-act="prep-draw">${t('prepDraw')}</button>`;
  }
  return `${head(g.name, t('equb') + ' · ' + fmt(g.amountC) + ' ' + esc(t(g.freq).toLowerCase()))}<main>
    <div class="card hero"><div class="row"><span class="soft">${t('pot')}</span><span class="pill" style="background:#fff;color:var(--g)">${esc(t('round', g.round, n))}</span></div>
      <span class="big">${fmt(g.amountC * n)}</span><span class="soft">${g.done ? t('equbDone') : d.winnerId ? t('collects', esc(mname(g, d.winnerId))) : t('noDraw')}</span>
      <div class="bar"><i style="width:${Math.round(paidN / n * 100)}%"></i></div><span class="soft">${t('paidCount', paidN, n)}</span></div>
    ${draw}
    ${ui.flash ? `<div class="warn" role="alert">${esc(ui.flash)}</div>` : ''}
    <div class="note">${t('noHold')}</div>

    case 'import':

    case 'wipe':

function render() {
  document.documentElement.lang = lang;
  let html;
  if (ui.view === 'lock') html = vLock();
  else if (!ME().name) { ui.sheet = null; html = vWelcome(); }
  else if (ui.view === 'history') html = vHistory();
  else if (ui.view === 'settings') html = vSettings();
  else if (ui.view === 'checked' && ui.chk) html = vChecked();
  else if (ui.view === 'group' && group()) { const g = group(); html = g.type === 'share' ? vShare(g) : g.type === 'equb' ? vEqub(g) : vIddir(g); }
  else { ui.view = 'home'; html = vHome(); }
  $('#app').innerHTML = html;
  const sh = $('#sheet');
  if (ui.sheet) { sh.classList.toggle('still', !!ui.sheet.shown); sh.innerHTML = sheetHtml(); sh.hidden = false; const f = sh.querySelector('input:not([type=checkbox]):not([type=file]),textarea,select,button'); if (f && !ui.sheet.shown) { f.focus(); ui.sheet.shown = true; } }
  else { sh.hidden = true; sh.innerHTML = ''; }
  ui.flash = '';
}
let toastTimer;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 1800); }
function copyText(text) {
  const fallback = () => { ui.sheet = { kind: 'info', html: `<textarea readonly aria-label="${t('copy')}">${esc(text)}</textarea>` }; render(); };
  try { navigator.clipboard.writeText(text).then(() => toast(t('copied')), fallback); } catch (e) { fallback(); }
}
/* The chosen people of the open "new share" form, as "name, phone" lines. */
function setPeople(fn) { const v = ui.sheet.vals = ui.sheet.vals || {}, L = plines(v.members); fn(L); v.members = L.slice(0, 500).join('\n'); }
/* Re-render a sheet without losing the place: scroll positions and the contact search stay. */
function keepScroll(fn) {
  const pos = s => { const el = $(s); return el ? el.scrollTop : 0; }, a = pos('#sheet form'), b = pos('#clist'), q = ($('#csearch') || {}).value || '';
  fn();
  const f = $('#sheet form'), cl = $('#clist'), cs = $('#csearch');
  if (cs && q) { cs.value = q; cs.dispatchEvent(new Event('input', { bubbles: true })); }
  if (f) f.scrollTop = a; if (cl) cl.scrollTop = b;
}
const confirmSheet = (msg, act, cls, extra) => { ui.sheet = Object.assign({ kind: 'confirm', msg, act, cls }, extra || {}); render(); };

/* ---------- actions ---------- */
const A = {
  go(d) { ui.view = d.view; ui.gid = null; ui.sheet = null; render(); },
  open(d) { ui.view = 'group'; ui.gid = d.id; ui.tab = 'exp'; ui.period = null; render(); },
  tab(d) { ui.tab = d.tab; render(); },
  close() { ui.sheet = null; render(); },
  async lang() { lang = lang === 'en' ? 'am' : 'en'; await persist(); render(); },
  async setlang(d) { lang = d.l; await persist(); render(); },
  new(d) { ui.sheet = { kind: 'new', type: d.type }; render(); },
  sheet(d) { ui.sheet = Object.assign({}, { ...d }); render(); },
  request(d) { ui.sheet = hasPay() ? { kind: 'request', from: d.from, amt: d.amt } : { kind: 'me', err: t('needPay'), back: { kind: 'request', from: d.from, amt: d.amt } }; render(); },
  async 'req-sent'() { await markReq(); },
  async 'req-share'() { const msg = $('#reqmsg').value; let ok = false; try { ok = await shareMsg(msg); } catch (e) { if (e && e.name === 'AbortError') return; } await markReq(); if (!ok) copyText(msg); },
  async 'qr-del'(d) { if (!QRS.some(q => q[0] === d.k)) return; snapMe(); delete ME()[d.k]; await persist(); keepScroll(render); },
  async 'req-copy'() { const msg = $('#reqmsg').value.split('\n').filter(l => l !== t('msgQr')).join('\n'); await markReq(); copyText(msg); },
  async pick(d) {
    let got; try { got = await navigator.contacts.select(['name', 'tel'], { multiple: !!d.multi }); } catch (e) { return; }
    const list = got.map(c => ({ name: (c.name && c.name[0] || '').trim(), phone: (c.tel && c.tel[0] || '').replace(/[^\d+]/g, '') })).filter(c => c.name || c.phone).map(c => ({ name: c.name || c.phone, phone: c.phone }));
    if (!list.length) return;
    if (!d.multi) { $('#pname').value = list[0].name; $('#pphone').value = list[0].phone; }
    addContacts(list); snapForm();
    if (d.multi) setPeople(L => { list.forEach(c => { if (!L.includes(cline(c))) L.push(cline(c)); }); });
    await persist(); keepScroll(render);
  },
  /* new share: people are added and removed one at a time */
  'add-contact'(d) { const c = (S.contacts || [])[Number(d.i)]; if (!c) return; snapForm(); setPeople(L => { if (!L.includes(cline(c))) L.push(cline(c)); }); keepScroll(render); },
  'rm-person'(d) { snapForm(); setPeople(L => { L.splice(Number(d.i), 1); }); keepScroll(render); },
  'add-manual'() {
    snapForm(); const v = ui.sheet.vals, name = String(v.pn || '').trim().replace(/[,;]+/g, ' ').slice(0, 60), phone = String(v.pp || '').replace(/[^\d+]/g, '').slice(0, 16);
    if (!name) { const el = $('#pn'); if (el) el.focus(); return; }
    setPeople(L => { const line = phone ? name + ', ' + phone : name; if (!L.includes(line)) L.push(line); }); v.pn = ''; v.pp = '';
    keepScroll(render); const el = $('#pn'); if (el) el.focus();
  },
  'use-contact'(d) { const c = (S.contacts || [])[Number(d.i)]; if (c) { $('#pname').value = c.name; $('#pphone').value = c.phone; } },
  month(d) { const p = period(); let m = p.m + Number(d.d), y = p.y; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } ui.period = { y, m }; render(); },

  'ask-void'(d) { confirmSheet(t('voidAsk'), 'void', 'danger', { id: d.id }); },
  async void() { const g = group(), e = g.expenses.find(x => x.id === ui.sheet.id); if (e && !e.void) await emit('void', g.id, { id: e.id }); await commit(); },
  /* The summary text members read, then the fingerprint and the code their app checks. */
  async 'send-summary'() {
    const g = group(), p = await Core.packGroup(S.ledger, g.id, ME().name);
    const pay = payLines(), short = summaryLines(g, mname).join('\n') + (pay.length ? '\n\n' + pay.join('\n') : '') + '\n\n' + t('fpLine', shortFp(p.fp));
    ui.sheet = { kind: 'summary', text: short + '\n' + t('sumHow') + '\n\n' + p.code, short }; render();
  },
  async 'sum-share'() { const msg = $('#summsg').value; try { if (await shareMsg(msg)) return; } catch (e) { if (e && e.name === 'AbortError') return; } copyText(msg); },
  'sum-copy'() { copyText($('#summsg').value); },
  async 'open-kept'(d) {
    const k = (S.kept || []).find(x => x.gid === d.id), r = k && await Core.openCopy(k, null);
    if (!r) return toast(t('badSum'));
    r.status = 'kept'; ui.chk = { c: k, r }; ui.view = 'checked'; ui.period = null; render();
  },
  'ask-keep-new'() { confirmSheet(t('keepAsk'), 'keep-new', 'danger'); },
  async 'keep-new'() { keepSummary(ui.chk.c, ui.chk.r.g); ui.chk.r.status = 'same'; await commit(); },
  'ask-drop-kept'() { confirmSheet(t('removeCopyAsk', ui.chk.r.g.name), 'drop-kept', 'danger'); },
  async 'drop-kept'() { S.kept = (S.kept || []).filter(k => k.gid !== ui.chk.c.gid); ui.chk = null; ui.view = 'home'; await commit(); },

  'ask-undo'(d) { confirmSheet(t('undoAsk'), 'undo', 'danger', { mid: d.mid, key: d.key }); },
  async undo() { const g = group(), s = ui.sheet, p = pays(g, s.key); if (p[s.mid]) await emit('undo', g.id, { key: s.key, mid: s.mid }); await commit(); },
  async 'prep-draw'() { const g = group(); if (g.done || g.draws[g.round]) return; const seed = Core.newSeed(), c = await Core.sha(seed); await emit('commit', g.id, { round: g.round, seed, commit: c }); await commit(); },
  async 'check-draw'(d0) {
    const g = group(), r = Number(d0.round), d = g.draws[r];
    const ok = (await Core.sha(d.seed)) === d.commit && d.eligible[await Core.pickIndex(d.seed, r, d.eligible.length, d.mix)] === d.winnerId;
    ui.sheet = { kind: 'info', html: `<div class="${ok ? 'note' : 'warn'} b">${ok ? t('drawOk') : t('drawBad')}</div><p class="b">${t('sealed')}</p><div class="mono">${esc(d.commit)}</div>${d.mix != null ? `<p class="b">${t('mixLabel')}</p><div class="mono">${esc(d.mix)}</div>` : ''}<p class="b">${t('opened')}</p><div class="mono">${esc(d.seed)}</div>` };
    render();
  },
  'ask-next'() {
    const g = group(), d = g.draws[g.round];
    if (!d || !d.winnerId) { ui.flash = t('drawFirst'); return render(); }
    const unpaid = g.members.length - Object.keys(pays(g, 'r' + g.round)).length;
    if (unpaid > 0) confirmSheet(t('unpaidWarn', unpaid), 'next', 'danger'); else A.next();
  },
  async next() { const g = group(); await emit('next', g.id, { round: g.round }); await commit(); },

  'ask-delete'() { confirmSheet(t('deleteAsk', group().name), 'delete', 'danger'); },
  async delete() { const g = group(); await emit('delete', g.id, { name: g.name }); ui.view = 'home'; ui.gid = null; await commit(); },

  async verify() { const bad = await Core.verifyLedger(S); ui.flash = bad ? t('ledgerBad', bad) : t('ledgerOk', S.ledger.length); render(); },
  async export() {
    const text = JSON.stringify(KEY ? await Core.seal(KEY, SALT, S) : S);
    ui.sheet = { kind: 'export', text, locked: !!KEY }; render();
  },
  'copy-exp'() { copyText($('#exp').value); },
  'save-exp'() {
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([$('#exp').value], { type: 'application/json' })); a.download = 'mahiber-backup-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { copyText($('#exp').value); }
  },
  'pin-off'() { confirmSheet(t('pinRemove') + '?', 'pin-off-yes', 'danger'); },
  async 'pin-off-yes'() { KEY = null; SALT = null; await commit(); },
  lock() { if (KEY && !volatile) doLock(); },
};
async function markReq() {
  const g = group(), s = ui.sheet; g.requests = g.requests || {};
  if (!g.requests[s.from]) await emit('request', g.id, { from: s.from, amountC: Number(s.amt) });
  await commit();
}
const keyLabel = (g, key) => key[0] === 'r' ? t('round', key.slice(1), g.members.length) : plabel({ y: Number(key.slice(1, 5)), m: Number(key.slice(6)) });
/* Keep the latest checked copy of a group; the next summary is compared with it. */
function keepSummary(c, g) {
  S.kept = (S.kept || []).filter(k => k.gid !== c.gid);
  S.kept.unshift({ gid: c.gid, by: c.by, name: g.name, type: g.type, ev: c.ev, seeds: c.seeds, at: new Date().toISOString() });
  if (S.kept.length > 200) S.kept.length = 200;
}
function doLock() { BOX = JSON.parse(lsGet(LS)); S = null; GROUPS = []; ALL = new Map(); ui.chk = null; KEY = null; SALT = null; ui.view = 'lock'; ui.sheet = null; ui.gid = null; render(); }

/* ---------- forms ---------- */
const fail = (msg, vals) => { ui.sheet.err = msg; ui.sheet.vals = vals; ui.sheet.shown = false; render(); };
const F = {
  async unlock(f) {
    let st = {}; try { st = JSON.parse(lsGet('mahiber.fail') || '{}'); } catch (e) {}
    const left = Math.ceil(((st.until || 0) - Date.now()) / 1000);
    if (left > 0) { ui.flash = t('wait', left); return render(); }
    let o = null;
    try { o = await Core.unseal(f.pin, BOX); if (!Core.validState(o.data)) throw new Error('bad'); }
    catch (e) {
      st.n = (st.n || 0) + 1; if (st.n >= 5) st.until = Date.now() + 30000 * (st.n - 4);
      lsSet('mahiber.fail', JSON.stringify(st)); ui.flash = t('wrongPin'); return render();
    }
    const old = o.data.v !== 2;
    if (old) keepCopy(LS + '.before-v2', JSON.stringify(BOX));
    S = await Core.migrate(o.data); derive(); KEY = o.key; SALT = o.salt; BOX = null; lang = S.lang || lang; lsDel('mahiber.fail'); ui.view = 'home';
    if (old) await persist();
    render();
  },
  async new(f) {
    const ty = ui.sheet.type, name = f.name.trim(), ms = people(f.members), amountC = Core.toC(f.amount), totalC = Core.toC(f.total);
    if (!name) return fail(t('needName'), f);
    if (ty === 'share' ? ms.length < 1 : ms.length < 2) return fail(t(ty === 'share' ? 'needPerson' : 'needTwo'), f);
    if (ty !== 'share' && !amountC) return fail(t('needAmount'), f);
    if (ty === 'share' && String(f.total || '').trim() && !totalC) return fail(t('needAmount'), f);
    const gid = Core.uid(), members = ms.map(x => ({ id: Core.uid(), name: x.name, phone: x.phone })), data = { type: ty, name, members };
    if (ty === 'share') members.unshift({ id: Core.uid(), name: t('me'), me: true });
    else { data.amountC = amountC; if (ty === 'equb') data.freq = ['daily', 'weekly', 'monthly'].includes(f.freq) ? f.freq : 'weekly'; }
    await emit('create', gid, data);
    if (ty === 'share' && totalC) await emit('expense', gid, { id: Core.uid(), what: name, amountC: totalC, paidBy: members[0].id, among: members.filter(m => f.includeMe || !m.me).map(m => m.id) });
    ui.view = 'group'; ui.gid = gid; ui.tab = 'exp'; ui.period = null; await commit();
  },
  async expense(f) {
    const g = group(), amountC = Core.toC(f.amount), among = f.among.filter(id => g.members.some(m => m.id === id));
    if (!f.what.trim()) return fail(t('needName'), f);
    if (!amountC) return fail(t('needAmount'), f);
    if (!among.length) return fail(t('needOne'), f);
    if (!g.members.some(m => m.id === f.paidBy)) return;
    await emit('expense', g.id, { id: Core.uid(), what: f.what.trim(), amountC, paidBy: f.paidBy, among }); await commit();
  },
  async person(f) {
    const g = group(), name = f.name.trim(); if (!name) return fail(t('needName'), f);
    const data = { id: Core.uid(), name, phone: String(f.phone || '').replace(/[\s-]/g, '') };
    const join = g.type === 'share' ? (f.join || []).filter(id => g.expenses.some(e => e.id === id && !e.void)) : [];
    if (join.length) data.join = join;
    await emit('member', g.id, data); await commit();
  },
  async settle(f) {
    const g = group(), s = ui.sheet, amt = Number(s.amt), method = METHODS.includes(f.method) ? f.method : 'cash', ref = f.ref.trim();
    if (method !== 'cash' && !ref) return fail(t('refNeed'), f);
    if (!Number.isSafeInteger(amt) || amt <= 0 || !g.members.some(m => m.id === s.from) || !g.members.some(m => m.id === s.to)) return;
    await emit('settle', g.id, { from: s.from, to: s.to, amountC: amt, method, ref }); await commit();
  },
  async me(f) {
    const m = readMe(f), e = meErr(m, !!ui.sheet.back); if (e) return fail(t(e), m);
    const back = ui.sheet.back; QRS.forEach(([k]) => { if (isQr(ME()[k])) m[k] = ME()[k]; }); /* the QR pictures are saved apart from the form */
    S.me = m; await persist(); ui.sheet = back || null; render();
  },
  async welcome(f) {
    const m = readMe(f), e = meErr(m, false); if (e) { ui.flash = t(e); ui.wvals = m; return render(); }
    QRS.forEach(([k]) => { if (isQr(ME()[k])) m[k] = ME()[k]; }); /* QR pictures chosen on this screen */
    S.me = m; ui.wvals = null; ui.view = 'home'; await persist();
    /* offer the app lock once, straight after the welcome; "Later" leaves it in Settings */
    if (!KEY && !volatile && window.crypto && crypto.subtle) ui.sheet = { kind: 'pin', offer: true };
    render();
  },
  async pay(f) {
    const g = group(), s = ui.sheet, method = METHODS.includes(f.method) ? f.method : 'cash', ref = f.ref.trim();
    if (method !== 'cash' && !ref) return fail(t('refNeed'), f);
    if (!g.members.some(m => m.id === s.mid) || pays(g, s.key)[s.mid]) return;
    await emit('pay', g.id, { key: s.key, mid: s.mid, method, ref }); await commit();
  },
  async draw(f) {
    const g = group(), d = g.draws[g.round], mix = String(f.mix || '').trim().replace(/\s+/g, ' ').slice(0, 40);
    if (!mix) return fail(t('needMix'), f);
    if (!d || d.winnerId) return;
    const won = equbWinners(g), elig = g.members.filter(m => !won.includes(m.id));
    const i = await Core.pickIndex(d.seed, g.round, elig.length, mix);
    await emit('draw', g.id, { round: g.round, mix, winnerId: elig[i].id, eligible: elig.map(m => m.id) }); await commit();
  },
  async payout(f) {
    const g = group(), amountC = Core.toC(f.amount);
    if (!f.reason.trim()) return fail(t('needName'), f);
    if (!amountC) return fail(t('needAmount'), f);
    if (!g.members.some(m => m.id === f.memberId)) return;
    await emit('payout', g.id, { id: Core.uid(), memberId: f.memberId, reason: f.reason.trim(), amountC }); await commit();
  },
  async pin(f) {
    if (!(window.crypto && crypto.subtle)) return fail(t('noCrypto'), {});
    if (f.a !== f.b || f.a.length < 6) { const offer = ui.sheet.offer; fail(t('pinMismatch'), {}); ui.sheet.offer = offer; return; }
    SALT = Core.rnd(16); KEY = await Core.deriveKey(f.a, SALT); await commit();
  },
  async import(f) {
    let d, key = null, salt = null; try { d = JSON.parse(f.json); } catch (e) { d = null; }
    if (d && d.enc === true && typeof d.ct === 'string') {
      if (!(window.crypto && crypto.subtle)) return fail(t('noCrypto'), { json: f.json });
      try { const o = await Core.unseal(String(f.pin || ''), d); d = o.data; key = o.key; salt = o.salt; }
      catch (e) { return fail(t('wrongPin'), { json: f.json }); }
    }
    /* an old (v1) backup is converted first, then the result is checked strictly */
    try { if (Core.validState(d)) d = await Core.migrate(d); } catch (e) { d = null; }
    if (!Core.validBackup(d)) return fail(t('badBackup'), {});
    S = { v: 2, lang: d.lang, me: d.me || {}, contacts: d.contacts || [], ledger: d.ledger, kept: d.kept || [] }; derive(); ui.chk = null;
    if (key) { KEY = key; SALT = salt; } /* a locked backup keeps its PIN */
    lang = S.lang === 'am' ? 'am' : 'en'; ui.view = 'home'; await commit();
  },
  async check(f) {
    const c = await Core.readPack(f.code), kept = c && (S.kept || []).find(k => k.gid === c.gid);
    const r = c && await Core.openCopy(c, kept);
    if (!r) return fail(t('badSum'), f);
    if (r.status !== 'changed') keepSummary(c, r.g); /* a changed record never replaces the kept copy by itself */
    ui.chk = { c, r }; ui.view = 'checked'; ui.gid = null; ui.period = null; await commit();
  },
  async wipe(f) {
    if (f.word.trim() !== 'DELETE') return fail(t('wipeAsk'), {});
    S = fresh(); derive(); KEY = null; SALT = null; lsDel('mahiber.fail'); ui.view = 'home'; await commit();
  },
};

/* ---------- wiring ---------- */
let busy = false;
async function run(fn, arg) { if (busy) return; busy = true; try { await fn(arg); } catch (e) { console.error(e); } finally { busy = false; } }
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) { if (ev.target.id === 'sheet') A.close(); return; }
  if (el.tagName === 'BUTTON' && el.closest('form') && el.type !== 'button') return;
  const fn = A[el.dataset.act]; if (fn) { if (el.tagName !== 'A') ev.preventDefault(); run(fn, el.dataset); }
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  const form = ev.target, fn = F[form.dataset.form]; if (!fn) return;
  const fd = new FormData(form), o = { among: fd.getAll('among'), join: fd.getAll('join') };
  for (const [k, v] of fd.entries()) if (k !== 'among' && k !== 'join' && typeof v === 'string') o[k] = v;
  run(fn, o);
});
document.addEventListener('change', ev => {
  const el = ev.target;
  /* A QR screenshot is shrunk to at most 640 px and kept with the payment details. */
  if (el.classList && el.classList.contains('qrfile') && el.files[0]) {
    const k = el.dataset.k, url = URL.createObjectURL(el.files[0]), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); toast(t('qrBad')); };
    img.onload = () => run(async () => {
      const sc = Math.min(1, 640 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.width * sc)); cv.height = Math.max(1, Math.round(img.height * sc));
      const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      const data = cv.toDataURL('image/jpeg', 0.85);
      if (!QRS.some(q => q[0] === k) || !isQr(data)) return toast(t('qrBad'));
      snapMe(); ME()[k] = data; await persist(); keepScroll(render);
    });
    img.src = url; return;
  }
  if (el.id === 'vcffile' && el.files[0]) {
    const r = new FileReader();
    r.onload = () => run(async () => { const list = Core.parseVcf(String(r.result)), n = addContacts(list); snapForm(); await persist(); keepScroll(render); toast(list.length ? t('imported', n) : t('noVcf')); });
    r.readAsText(el.files[0]); return;
  }
  if (ev.target.id !== 'impfile' || !ev.target.files[0]) return;
  const r = new FileReader(); r.onload = () => { const ta = $('#imp'); if (ta) ta.value = String(r.result); }; r.readAsText(ev.target.files[0]);
});
document.addEventListener('input', ev => {
  /* The CBE account is normally in the user's own name: fill the holder name from "Your name"
     once an account number is typed, and stop as soon as the user edits the holder name. */
  const fm = ev.target.form, el = ev.target;
  if (fm && fm.elements.cbeName && ['name', 'cbe', 'cbeName'].includes(el.name)) {
    const h = fm.elements.cbeName;
    if (el === h) h.dataset.auto = '';
    else if (!h.value || h.dataset.auto) { h.value = fm.elements.cbe.value.trim() ? fm.elements.name.value.trim() : ''; h.dataset.auto = '1'; }
    return;
  }
  if (ev.target.id !== 'csearch') return; const q = ev.target.value.trim().toLowerCase();
  document.querySelectorAll('#clist .crow').forEach(r => { r.style.display = r.dataset.q.includes(q) ? '' : 'none'; });
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && ui.sheet) A.close();
  /* Enter in the "not in contacts" boxes adds that person; it must not create the share */
  if (ev.key === 'Enter' && (ev.target.id === 'pn' || ev.target.id === 'pp')) { ev.preventDefault(); run(A['add-manual']); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (KEY && !volatile && hiddenAt && Date.now() - hiddenAt > 120000) doLock();
});

/* A spare copy that must never stop the app, so a full storage is ignored here. */
function keepCopy(k, v) { try { if (localStorage.getItem(k) == null) localStorage.setItem(k, v); } catch (e) {} }
(async function boot() {
  try { localStorage.setItem('mahiber.t', '1'); localStorage.removeItem('mahiber.t'); } catch (e) { volatile = true; }
  lang = lsGet('mahiber.lang') === 'am' ? 'am' : 'en';
  const raw = lsGet(LS); let box = null; try { box = JSON.parse(raw); } catch (e) {}
  if (box && box.enc) { BOX = box; ui.view = 'lock'; }
  else if (box && Core.validState(box.data)) {
    const old = box.data.v !== 2;
    try {
      if (old) keepCopy(LS + '.before-v2', raw); /* the old record stays on the phone after the upgrade */
      S = await Core.migrate(box.data); derive(); lang = S.lang === 'am' ? 'am' : lang;
      if (old) await persist();
    } catch (e) { console.error(e); keepCopy(LS + '.unreadable', raw); S = fresh(); derive(); }
  }
  else { if (raw) keepCopy(LS + '.unreadable', raw); S = fresh(); }
  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
  try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
})();
})();
</script>
